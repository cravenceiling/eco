[package]
name = "eco-stt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Dictate on your phone, transcribe on your computer: an OpenAI-compatible speech-to-text server running a local Parakeet model"
license = "MIT"
repository = "https://github.com/cravenceiling/eco"
readme = "README.md"

[[bin]]
name = "eco"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
if-addrs = "0.15.0"
log = "0.4.35"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "fs", "time"] }
toml = "1.2.0"
transcribe-cpp = "0.4.1"

[profile.release]
strip = true
lto = "thin"
